<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISOM2007 · Introduction to Programming 学习站</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #eef3f2;
      --ink: #17201e;
      --muted: #64706d;
      --line: #d7dedc;
      --brand: #086b62;
      --brand-dark: #064c46;
      --brand-soft: #d9efeb;
      --gold: #a86e10;
      --gold-soft: #fff1ce;
      --danger: #a53c32;
      --danger-soft: #fae7e4;
      --success: #157347;
      --success-soft: #e0f3e8;
      --shadow: 0 12px 30px rgba(23, 32, 30, .08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.72;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 286px 1fr; }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      padding: 24px 18px; background: #102b28; color: #fff;
    }
    .brand { padding: 0 8px 20px; border-bottom: 1px solid rgba(255,255,255,.16); }
    .brand small { display: block; color: #9fc6c1; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .brand strong { display: block; margin-top: 6px; font-size: 20px; line-height: 1.35; }
    .side-progress { padding: 18px 8px 10px; }
    .side-progress-row { display: flex; justify-content: space-between; font-size: 13px; color: #c9ddda; }
    .progress-track { height: 7px; margin-top: 9px; overflow: hidden; border-radius: 4px; background: rgba(255,255,255,.14); }
    .progress-fill { height: 100%; width: 0; background: #64cfbd; transition: width .3s ease; }
    .lesson-list { display: grid; gap: 5px; margin-top: 10px; }
    .lesson-link {
      width: 100%; min-height: 42px; display: grid; grid-template-columns: 26px 1fr 20px; gap: 8px; align-items: center;
      border: 0; border-radius: 6px; padding: 8px; color: #c8dcda; background: transparent; text-align: left;
    }
    .lesson-link:hover:not(:disabled) { background: rgba(255,255,255,.08); color: #fff; }
    .lesson-link.active { color: #fff; background: #1d514b; }
    .lesson-link .num { font-size: 12px; color: #9fc6c1; font-variant-numeric: tabular-nums; }
    .lesson-link .name { font-size: 13px; line-height: 1.35; }
    .lesson-link .state { font-size: 14px; text-align: center; }
    .mobile-bar { display: none; }
    main { min-width: 0; }
    .topbar {
      height: 70px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(22px, 5vw, 70px); border-bottom: 1px solid var(--line); background: rgba(244,246,248,.95);
    }
    .crumb { color: var(--muted); font-size: 14px; }
    .score-live { font-weight: 700; color: var(--brand-dark); }
    .content { width: min(920px, calc(100% - 44px)); margin: 34px auto 80px; }
    .lesson { display: none; }
    .lesson.active { display: block; animation: enter .25s ease; }
    @keyframes enter { from { opacity: .2; transform: translateY(8px); } }
    .eyebrow { color: var(--brand); font-weight: 800; font-size: 13px; text-transform: uppercase; }
    h1 { margin: 6px 0 12px; font-size: clamp(30px, 4vw, 46px); line-height: 1.18; letter-spacing: 0; }
    .lead { max-width: 760px; margin: 0; color: var(--muted); font-size: 17px; }
    .learning-card, .quiz-block, .result-card {
      margin-top: 28px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow);
    }
    .learning-card { padding: clamp(22px, 4vw, 40px); }
    .learning-card h2, .quiz-block h2 { margin: 0 0 16px; font-size: 23px; line-height: 1.35; }
    .learning-card h3 { margin: 28px 0 8px; font-size: 18px; }
    .learning-card p { margin: 10px 0; }
    .learning-card ul, .learning-card ol { padding-left: 22px; }
    .learning-card li { margin: 7px 0; }
    .plain {
      margin: 22px 0; padding: 17px 19px; border-left: 4px solid var(--brand);
      background: var(--brand-soft); color: #113d38;
    }
    .plain strong { display: block; margin-bottom: 4px; }
    .example { margin: 22px 0; padding: 18px; border: 1px solid #ead7a8; border-radius: 6px; background: var(--gold-soft); }
    .example strong { color: #704708; }
    .warning { margin: 22px 0; padding: 18px; border: 1px solid #e8b9b4; border-radius: 6px; background: var(--danger-soft); }
    .formula { margin: 20px 0; padding: 14px; overflow-x: auto; background: #17201e; color: #dff5f1; border-radius: 6px; text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 14px; }
    th, td { padding: 10px 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: var(--surface-soft); }
    .quiz-block { overflow: hidden; }
    .quiz-head { padding: 22px 26px; background: #eef3f2; border-bottom: 1px solid var(--line); }
    .quiz-head p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
    .question { padding: 24px 26px; border-bottom: 1px solid var(--line); }
    .question:last-of-type { border-bottom: 0; }
    .question-title { margin: 0 0 14px; font-weight: 750; }
    .options { display: grid; gap: 10px; }
    .option {
      display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start;
      padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
    }
    .option:hover { border-color: #7ca9a3; background: #f7fbfa; }
    .option input { margin-top: 5px; accent-color: var(--brand); }
    .option.correct { border-color: var(--success); background: var(--success-soft); }
    .option.wrong { border-color: var(--danger); background: var(--danger-soft); }
    .feedback { display: none; margin-top: 12px; padding: 11px 13px; border-radius: 5px; font-size: 14px; }
    .feedback.show { display: block; }
    .feedback.good { color: #0a5332; background: var(--success-soft); }
    .feedback.bad { color: #7f2922; background: var(--danger-soft); }
    .quiz-actions, .page-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .quiz-actions { padding: 20px 26px; border-top: 1px solid var(--line); background: #fafbfb; }
    .page-actions { margin-top: 24px; }
    .btn {
      min-height: 44px; border: 1px solid transparent; border-radius: 6px; padding: 9px 17px; font-weight: 750;
    }
    .btn-primary { color: #fff; background: var(--brand); }
    .btn-primary:hover:not(:disabled) { background: var(--brand-dark); }
    .btn-secondary { color: var(--ink); border-color: var(--line); background: var(--surface); }
    .btn-secondary:hover:not(:disabled) { background: var(--surface-soft); }
    .quiz-status { color: var(--muted); font-size: 14px; }
    .result-card { padding: clamp(24px, 5vw, 48px); }
    .result-score { display: flex; align-items: end; gap: 10px; margin: 20px 0; }
    .result-score strong { font-size: 64px; line-height: 1; color: var(--brand); }
    .result-score span { color: var(--muted); }
    .result-band { height: 12px; overflow: hidden; border-radius: 6px; background: #e2e7e6; }
    .result-band div { height: 100%; background: var(--brand); }
    .weak-list { margin-top: 22px; padding: 0; list-style: none; display: grid; gap: 8px; }
    .weak-list li { padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; background: #fafbfb; }
    .hidden { display: none !important; }
    @media (max-width: 860px) {
      .app { display: block; }
      .sidebar { position: fixed; z-index: 20; left: 0; width: min(330px, 88vw); transform: translateX(-105%); transition: transform .25s ease; }
      .sidebar.open { transform: translateX(0); box-shadow: 20px 0 50px rgba(0,0,0,.25); }
      .mobile-bar { display: block; border: 0; background: transparent; color: var(--ink); font-size: 23px; }
      .topbar { padding: 0 18px; }
      .crumb { display: none; }
    }
    @media (max-width: 520px) {
      .content { width: min(100% - 24px, 920px); margin-top: 24px; }
      .learning-card { padding: 20px; }
      .quiz-head, .question, .quiz-actions { padding-left: 18px; padding-right: 18px; }
      .quiz-actions, .page-actions { align-items: stretch; flex-direction: column; }
      .btn { width: 100%; }
      .score-live { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="课程目录">
      <div class="brand"><small>ISOM2007 · Programming for Business Analytics</small><strong>Lecture 1 学习站</strong></div>
      <div class="side-progress">
        <div class="side-progress-row"><span>章节进度</span><span id="progressText">0 / 18</span></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <nav class="lesson-list" id="lessonList"></nav>
    </aside>
    <main>
      <header class="topbar">
        <button class="mobile-bar" id="menuButton" aria-label="打开课程目录" aria-expanded="false">☰</button>
        <span class="crumb" id="crumb">Lecture 1 · 从零开始</span>
        <span class="score-live" id="scoreLive">得分 0 / 0</span>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <script>
    const databaseLessons = [
      {
        title: '数据、信息与知识',
        summary: '先分清数据库课程最基础的三个词：Data、Information 和 Knowledge。',
        body: `
          <h2>同一个数字，为什么有时只是数据，有时却是信息？</h2>
          <p><strong>数据（Data）</strong>是描述人、事物或事件的原始事实。它可以是数字、文字、日期、图片或声音，例如“82”“Winnie”“2026-08-25”。单独看到这些值，你可能还不知道它们代表什么。</p>
          <p><strong>信息（Information）</strong>是经过整理、计算、比较或解释后，对使用者有意义的数据。例如：“Winnie 的数据库考试是 82 分，比班级平均分高 7 分。”这句话告诉了你对象、含义和比较结果，因此能帮助判断。</p>
          <p><strong>知识（Knowledge）</strong>是人根据经验和信息形成的理解。例如根据多次成绩判断：“Winnie 对概念题掌握较好，但 SQL 练习不足。”</p>
          <div class="plain"><strong>大白话</strong>数据是食材，信息是做好的菜，知识是你吃过以后知道这道菜该怎样改进。</div>
          <div class="example"><strong>例子：</strong>“MOP 3,500”只是数据；“这台显示器售价 MOP 3,500，比预算高 MOP 500”是信息。</div>
          <div class="warning"><strong>易错：</strong>信息不是一种特殊格式。数据只要经过处理并增加了使用者的认识，就可以成为信息。</div>`,
        questions: [
          ['下列哪一项最符合“信息”的定义？', ['数据库中保存的数字 82', '经过处理、能够增加使用者认识的数据', '任何未经解释的原始事实', '只包括文字和日期的数据'], 1, '信息的关键是“经过处理并对使用者有意义”，而不是某一种数据格式。'],
          ['“某学生 GPA 为 3.4，比专业平均值高 0.2”属于什么？', ['只有原始数据', '信息', '元数据', '数据库软件'], 1, '它把 GPA 与平均值进行比较，已经提供了可理解的含义。']
        ]
      },
      {
        title: '结构化与非结构化数据',
        summary: '理解哪些数据容易放进表格，哪些数据没有固定行列格式。',
        body: `
          <h2>能整齐放进表格的数据，通常就是结构化数据</h2>
          <p><strong>结构化数据（Structured Data）</strong>具有预先定义的格式。每条记录通常包含相同字段，每个字段有明确类型。例如商品表中的 Product-ID、Product-name 和 Price。</p>
          <table><thead><tr><th>Product-ID</th><th>Product-name</th><th>Price</th></tr></thead><tbody><tr><td>P001</td><td>Printer</td><td>1080.00</td></tr><tr><td>P002</td><td>Monitor</td><td>3500.00</td></tr></tbody></table>
          <p><strong>非结构化数据（Unstructured Data）</strong>没有统一、固定的行列结构，例如照片、视频、录音、PDF、自由文本和社交媒体内容。</p>
          <div class="plain"><strong>大白话</strong>Excel 风格的名单很像结构化数据；一段自拍视频虽然有内容，却不能自然拆成固定的姓名列、日期列和价格列。</div>
          <p>非结构化不代表完全没有任何结构。照片仍可能有拍摄时间等元数据，但照片画面本身不是传统关系表中的固定字段集合。</p>
          <div class="warning"><strong>易错：</strong>数据库也能保存图片和文档。这里的区别是数据本身是否具有预定义格式，不是“能不能被电脑保存”。</div>`,
        questions: [
          ['下面哪一项最典型地属于结构化数据？', ['访谈录音', '学生表中的学号、姓名和 GPA', '课堂录像', '一篇没有固定格式的长文章'], 1, '学生表有固定字段和数据类型，最符合结构化数据定义。'],
          ['关于非结构化数据，哪项说法正确？', ['电脑无法保存', '没有价值', '没有预先定义的固定行列格式', '一定没有任何元数据'], 2, '非结构化指缺少固定表格结构，不代表不能保存、没有价值或没有元数据。']
        ]
      },
      {
        title: '数据库与逻辑关联',
        summary: '数据库不是随便堆文件，而是有组织、逻辑相关的数据集合。',
        body: `
          <h2>Database 到底是什么？</h2>
          <div class="formula">Database = organized collection of logically related data</div>
          <p><strong>数据库（Database）</strong>是经过组织、并且在逻辑上相互关联的数据集合。“有组织”表示它遵循结构和规则；“逻辑相关”表示其中的数据围绕共同业务主题发生联系。</p>
          <p>例如学校数据库中的 STUDENT、COURSE、INSTRUCTOR 和 CLASS 都围绕教学业务，并能通过学号、课程编号等字段联系起来。</p>
          <div class="plain"><strong>大白话</strong>把一堆无关文件丢进同一个文件夹，不会自动变成数据库。数据库像管理严格的药材柜：每样东西有位置、有标签、有查找规则，而且彼此之间有业务关系。</div>
          <h3>数据库能做什么？</h3>
          <ul><li>保存和检索数据</li><li>插入、修改和删除记录</li><li>控制访问权限</li><li>验证数据是否符合规则</li><li>支持多个程序共享数据</li></ul>`,
        questions: [
          ['下列哪项最准确地描述数据库？', ['同一文件夹中的所有文件', '有组织且逻辑相关的数据集合', '只保存数字的表格', '任何数据库管理软件'], 1, '定义的两个关键词是 organized 和 logically related。'],
          ['下面哪组数据最适合构成一个学校数据库？', ['学生、课程、教师、班级', '随机照片、音乐和电影', '三个互不相关的个人文件夹', '只有一张背景图片'], 0, '四类数据都围绕学校教学业务并能相互关联。']
        ]
      },
      {
        title: '表、记录、字段与键',
        summary: '学会读懂关系数据库最常见的表格结构。',
        body: `
          <h2>一张学生表里，每个部分叫什么？</h2>
          <p><strong>表（Table）</strong>保存同一类实体的数据；<strong>行（Row/Record/Tuple）</strong>表示一个实体实例；<strong>列（Column/Field/Attribute）</strong>表示一种属性；<strong>单元格</strong>是某条记录某个属性的具体值。</p>
          <table><thead><tr><th>Student-ID</th><th>Name</th><th>Major</th><th>GPA</th></tr></thead><tbody><tr><td>324917628</td><td>Kenneth</td><td>MGT</td><td>2.9</td></tr><tr><td>476193248</td><td>Joan</td><td>MKT</td><td>3.4</td></tr></tbody></table>
          <p><strong>主键（Primary Key）</strong>用于唯一识别每一行，例如 Student-ID。它不能在两位学生之间重复。</p>
          <p><strong>外键（Foreign Key）</strong>保存另一张表的主键值，用来建立表之间的关系。例如 Student 表中的 Course-ID 指向 Course 表的 Course-ID。</p>
          <div class="plain"><strong>大白话</strong>主键像每个人独有的身份证号；外键像表里写下另一个对象的身份证号，从而知道它和谁有关。</div>
          <div class="warning"><strong>易错：</strong>姓名通常不适合当主键，因为可能重名，也可能发生变更。</div>`,
        questions: [
          ['在学生表中，一整行通常代表什么？', ['一种属性', '一名学生的完整记录', '整个数据库', '一个 DBMS'], 1, '关系表的一行表示一个实体实例，在这里就是一名学生。'],
          ['主键最重要的作用是什么？', ['让表格颜色一致', '唯一识别每一行', '保存所有图片', '代替数据库备份'], 1, '主键值必须能唯一定位一条记录。']
        ]
      },
      {
        title: '元数据与 Repository',
        summary: '理解“描述数据的数据”，以及系统为什么需要集中保存这些定义。',
        body: `
          <h2>Metadata：不是学生资料，而是学生资料的规则</h2>
          <p><strong>元数据（Metadata）</strong>是描述用户数据的性质和上下文的数据，也就是 data about data。</p>
          <table><thead><tr><th>字段</th><th>类型</th><th>长度/范围</th><th>约束</th></tr></thead><tbody><tr><td>Student-ID</td><td>Alphanumeric</td><td>11</td><td>Required, Unique</td></tr><tr><td>GPA</td><td>Decimal</td><td>0.0–4.0</td><td>Required</td></tr></tbody></table>
          <p>表里的真实学号和 GPA 是用户数据；字段类型、长度、允许范围和是否必填是元数据。</p>
          <p><strong>Repository（资料库/数据仓库）</strong>是集中保存数据定义、约束、索引和其他元数据的位置。DBMS 和开发人员可以据此理解数据结构。</p>
          <div class="plain"><strong>大白话</strong>用户数据是“这位学生 GPA 是 3.4”；元数据是“GPA 必须是 0.0 到 4.0 之间的小数”。</div>
          <div class="warning"><strong>易错：</strong>本章中的 repository 主要指元数据资料库，不等同于存放实际业务记录的 database。</div>`,
        questions: [
          ['下列哪一项是元数据？', ['Winnie', 'GPA 3.4', 'GPA 的允许范围为 0.0 到 4.0', '某学生的照片'], 2, '允许范围描述了 GPA 字段的规则，因此是元数据。'],
          ['Repository 在本章中的主要作用是什么？', ['只保存视频', '集中保存数据定义和元数据', '代替全部应用程序', '只用于打印报表'], 1, 'Repository 是记录字段、类型、约束等定义的中央位置。']
        ]
      },
      {
        title: '传统文件处理系统',
        summary: '先理解旧方法如何工作，才能真正明白为什么需要数据库。',
        body: `
          <h2>每个部门各管一套文件，会发生什么？</h2>
          <p>传统文件处理系统通常针对某一个部门、某一个程序的需要建立。订单部、会计部和工资部可能各有自己的程序与文件。</p>
          <h3>五个核心缺点</h3>
          <ol><li><strong>Program-data dependence：</strong>程序必须知道具体文件格式，格式变化会迫使程序修改。</li><li><strong>Duplication of data：</strong>多个部门保存同一客户或库存数据。</li><li><strong>Limited data sharing：</strong>数据被隔离在部门和程序中。</li><li><strong>Lengthy development time：</strong>每个程序都要重新设计文件格式和处理逻辑。</li><li><strong>Excessive maintenance：</strong>文件或业务规则一变，许多程序都要维护。</li></ol>
          <div class="plain"><strong>大白话</strong>像三个部门各自保存一份客户通讯录。客户搬家后，有人改了新地址，有人没改，于是公司内部同时存在几个“正确答案”。</div>
          <p><strong>数据冗余（Redundancy）</strong>会进一步造成<strong>数据不一致（Inconsistency）</strong>，这比浪费硬盘更严重。</p>`,

          <div class="plain"><strong>大白话</strong>Implementation 是把房屋设计图真正盖成房子；Maintenance 是入住后维修水电、提升设施，并为新的需求再次改造。</div>`,
        questions: [
          ['建立数据库、编写程序、测试和培训属于哪个阶段？', ['Analysis', 'Implementation', 'Planning', 'Metadata'], 1, '这些工作把设计真正转化为可运行系统。'],
          ['系统上线后修复错误和优化慢查询属于哪个阶段？', ['Maintenance', 'Planning', 'Conceptual Modeling', 'File Processing'], 0, '上线后的监控、修复和增强都是维护工作。']
        ]
      },
      {
        title: '数据库项目团队',
        summary: '认识分析师、建模师、程序员、用户和数据管理员各自负责什么。',
        body: `
          <h2>数据库项目不是程序员一个人完成的</h2>
          <ul><li><strong>Business/System Analysts：</strong>理解业务、访谈用户并形成系统需求。</li><li><strong>Database Analysts/Data Modelers：</strong>设计实体、属性、关系、键和约束。</li><li><strong>Users：</strong>提出实际需要，解释流程并参与验收。</li><li><strong>Programmers：</strong>编写与数据库交互的应用、接口和报表。</li><li><strong>Data Administrators：</strong>制定组织层面的数据标准，确保数据完整和一致。</li><li><strong>Database Administrators：</strong>管理 DBMS、权限、性能、备份和恢复。</li></ul>
          <div class="plain"><strong>大白话</strong>分析师问清楚要做什么，建模师设计数据骨架，程序员把系统写出来，用户确认是否好用，管理员确保数据和数据库长期可靠。</div>
          <div class="warning"><strong>易错：</strong>Data Administrator 偏数据政策、标准和治理；Database Administrator 偏数据库软件的运行管理。教材或老师有时会合并讲，但职责侧重点不同。</div>`,
        questions: [
          ['谁最主要负责分析业务环境并确定系统需求？', ['Business/System Analyst', 'End User only', 'DBMS', 'Database file'], 0, '业务/系统分析师连接业务需要与系统要求。'],
          ['谁通常负责 DBMS 权限、性能、备份和恢复？', ['Database Administrator', 'Customer', 'Course entity', 'Metadata value'], 0, '这些是 DBA 的典型运行管理职责。']
        ]
      }
    ];

    const lessons = [
      {title:'硬件与计算机组成',summary:'认识 Hardware，以及输入、处理、存储和输出如何组成计算机。',body:`<h2>硬件就是计算机中真实存在的物理部件</h2><p><strong>Hardware</strong> 包括键盘、鼠标、显示器、CPU、内存、硬盘等。它们可以按功能分为输入、处理、存储和输出。</p><div class="formula">Input 输入 → CPU 处理 ↔ Storage 存储 → Output 输出</div><ul><li><strong>输入设备：</strong>把数据送入计算机，如键盘、鼠标、麦克风。</li><li><strong>CPU：</strong>执行程序控制与数据处理。</li><li><strong>存储设备：</strong>保存程序和数据。</li><li><strong>输出设备：</strong>把结果交给用户，如屏幕和打印机。</li></ul><div class="plain"><strong>大白话</strong>键盘像收订单，CPU 像厨房，内存像操作台，硬盘像仓库，屏幕像出餐口。</div><div class="warning"><strong>易错：</strong>键盘属于硬件；Word、游戏和操作系统属于软件。</div>`,questions:[['下列哪项属于硬件？',['Microsoft Word','键盘','Python 程序','操作系统'],1,'键盘是实际存在的物理设备。'],['CPU 的主要角色是什么？',['长期断电保存文件','执行指令并处理数据','只负责打印','只负责输入'],1,'CPU 是程序控制与数据处理的核心。']]},
      {title:'CPU：控制单元与 ALU',summary:'理解 CPU 内的两大部分怎样分工：一个指挥，一个计算。',body:`<h2>CPU 不只会计算，还要控制整个执行过程</h2><p><strong>控制单元（Control Unit）</strong>读取、解释指令，决定处理顺序，协调 CPU、内存与输入输出设备，并发出控制信号。</p><p><strong>算术逻辑单元（ALU）</strong>负责加减乘除、比较大小、判断相等等实际运算。</p><div class="plain"><strong>大白话</strong>控制单元像主管，决定下一步做什么；ALU 像执行人员，完成主管要求的计算与比较。</div><div class="example"><strong>例子：</strong><code>price * quantity</code> 主要由 ALU 计算；何时执行这条指令由控制单元协调。</div>`,questions:[['控制单元主要负责什么？',['解释指令并协调执行','长期保存文件','只做乘法','显示图像'],0,'控制单元负责指挥和协调处理器。'],['ALU 主要负责什么？',['计算和逻辑比较','接收鼠标点击','编写程序','断电保存数据'],0,'ALU 包含算术和逻辑运算电路。']]},
      {title:'主存储与辅助存储',summary:'分清 RAM 与硬盘在速度、价格和持久性上的区别。',body:`<h2>正在使用的东西放桌面，长期保存的东西放仓库</h2><p><strong>Primary Storage</strong> 主要指 RAM。它速度快，CPU 可以频繁访问，但通常是易失性的：断电后内容消失。</p><p><strong>Secondary Storage</strong> 包括硬盘、SSD、U 盘等。它较慢、单位成本较低，却具有持久性：断电后数据仍然保留。</p><div class="formula">程序平时在辅助存储 → 运行时载入 RAM → CPU 执行</div><div class="plain"><strong>大白话</strong>RAM 是书桌，取东西快但不能长期保留；硬盘是档案室，取东西慢一点却适合长期保存。</div>`,questions:[['哪种存储通常断电后丢失内容？',['RAM','SSD','硬盘','U盘'],0,'RAM 是典型易失性主存。'],['程序运行前通常会怎样？',['从辅助存储载入内存','从内存移到鼠标','直接在打印机执行','变成硬件'],0,'CPU 通常从内存读取正在运行的程序。']]},
      {title:'内存地址与容量单位',summary:'理解 address、bit、byte、KB、MB 和 GB。',body:`<h2>内存像一排有唯一编号的小格子</h2><p>每个内存位置都有唯一<strong>地址（Address）</strong>，CPU 通过地址找到需要的数据。</p><ul><li>1 bit 只能是 0 或 1。</li><li>1 byte = 8 bits。</li><li>1 KB = 2<sup>10</sup> = 1,024 bytes。</li><li>1 MB = 2<sup>20</sup> bytes。</li><li>1 GB = 2<sup>30</sup> = 1,073,741,824 bytes。</li></ul><div class="formula">KB → MB → GB → TB → PB → EB → ZB → YB</div><div class="warning"><strong>准确性：</strong>课件采用二进制换算；硬盘厂商有时用十进制单位，所以系统显示容量可能不同。</div>`,questions:[['一个 byte 等于多少 bits？',['2','4','8','1024'],2,'1 byte 固定等于 8 bits。'],['按课件定义，1 KB 等于多少 bytes？',['1000','1024','1,048,576','8'],1,'1 KB = 2 的 10 次方 = 1024 bytes。']]},
      {title:'程序如何被执行',summary:'从辅助存储到 RAM，再由 CPU 一条一条执行指令。',body:`<h2>启动程序后，计算机内部发生什么？</h2><ol><li>程序指令和数据以数字格式保存在辅助存储。</li><li>启动时，程序被载入内存。</li><li>CPU 从内存读取并逐条执行指令。</li><li>程序可以根据用户输入改变执行过程。</li><li>CPU 读取、修改数据，再把结果写到内存、屏幕或辅助存储。</li></ol><div class="plain"><strong>大白话</strong>CPU 不是一次完成整个程序，而是以极快速度不断取指令、解释指令、执行指令。</div>`,questions:[['程序启动后通常先进入哪里？',['RAM','打印机','键盘','纸张'],0,'正在执行的程序需载入主存。'],['CPU 怎样运行程序？',['一次完成全部','按流程逐条执行指令','只读不写','只处理视频'],1,'CPU 按执行顺序处理指令。']]},
      {title:'软件、程序与编程',summary:'分清 Software、Program 和 Programming。',body:`<h2>软件是能被计算机执行的指令和决策</h2><p><strong>Software</strong> 包括应用程序、游戏、操作系统和设备驱动。复杂软件最终由大量简单指令组合。</p><p><strong>Program</strong> 是指导计算机完成特定任务的步骤序列。</p><p><strong>Programming</strong> 不只是打代码，而是设计、实现和测试计算机程序的完整活动。</p><div class="plain"><strong>大白话</strong>算法是解题方案，程序是用编程语言写成的版本，编程是把方案设计、写出并验证的全过程。</div><div class="warning"><strong>核心提醒：</strong>计算机只会执行你明确写下的指令，不会自动理解你的期待。</div>`,questions:[['下列哪项属于软件？',['CPU','操作系统','键盘','内存芯片'],1,'操作系统是管理计算机资源的软件。'],['Programming 的完整含义是什么？',['只输入代码','设计、实现和测试程序','安装软件','修理硬件'],1,'课件强调完整开发活动。']]},
      {title:'问题求解与开发流程',summary:'从定义问题开始，经过设计、实现、调试、文档与维护。',body:`<h2>写代码不是第一步</h2><div class="formula">定义和分析 → 算法/流程图 → 翻译成程序 → 编译、测试、调试 → 文档和维护</div><p>先弄清输入、输出、限制和目标，再设计步骤，然后才选择编程语言实现。如果测试没有达到目标，就返回设计或编辑阶段修改后再测试。</p><div class="plain"><strong>大白话</strong>先确认题目问什么，再写解题步骤，最后才翻译成代码。直接开写，往往只是更快地写出错误程序。</div>`,questions:[['合理的第一步是什么？',['立刻打代码','定义并分析问题','删除文档','忽略输入输出'],1,'必须先理解问题。'],['测试未达到目标时怎么办？',['宣布完成','返回修改并重新测试','换显示器','删除输入'],1,'开发过程包含反馈循环。']]},
      {title:'算法：含义与独立性',summary:'算法是有顺序的解题步骤，本身不依赖具体语言和机器。',body:`<h2>Algorithm 是一份精确的解题计划</h2><p>算法是为完成任务而安排的一系列有顺序的动作，像烤蛋糕的食谱、织毛衣的图样。顺序改变，结果可能改变。</p><p>当执行者是计算机时，需要把算法用编程语言表达为程序；算法的每一步对应程序中的语句或指令。</p><div class="formula">Algorithm + Programming Language → Program → Execution</div><p>同一算法能用 Python、Java 等不同语言实现，也能在不同计算机运行，因此算法通常独立于具体语言和机器。</p>`,questions:[['算法是什么？',['随机代码','解决问题的有序步骤','硬件','Python专属语法'],1,'算法强调有序的解决步骤。'],['为什么算法独立于语言？',['逻辑可用不同语言实现','所有语法相同','算法没有步骤','只能由人执行'],0,'解题逻辑可以翻译成不同语言。']]},
      {title:'好算法的三个条件',summary:'Unambiguous、Executable、Terminating 是高频定义。',body:`<h2>不是所有步骤说明都算合格算法</h2><ol><li><strong>Unambiguous：</strong>无歧义，每一步精确，不需要执行者猜。</li><li><strong>Executable：</strong>可执行，步骤在现实中能够完成。</li><li><strong>Terminating：</strong>会终止，算法最终停止。</li></ol><div class="example"><strong>反例：</strong>“加入适量水”对机器人有歧义；没有停止条件的循环可能永不终止；要求一步完成不可能操作则不可执行。</div><div class="plain"><strong>大白话</strong>好算法要做到：不用猜、做得到、做得完。</div>`,questions:[['“加入一点水”主要违反什么？',['Terminating','Unambiguous','Storage','Compilation'],1,'“一点”不精确。'],['永远重复且无停止条件违反什么？',['Executable','Terminating','Input','Output'],1,'合格算法应最终停止。']]},
      {title:'逐步求精',summary:'把大问题逐层拆成更具体、可执行的小步骤。',body:`<h2>复杂问题不要一次写完</h2><p><strong>Stepwise Refinement</strong> 将过程拆成较小步骤，再把仍然复杂的步骤继续细化，直到执行者能够直接完成。</p><div class="formula">1.0 boil water → 1.1 fill kettle → 1.2 switch on → 1.3 wait → 1.4 switch off</div><p>制作咖啡的顶层还有 put coffee in cup 和 add water to cup，它们也可以分别细化。</p><div class="plain"><strong>大白话</strong>先写目录，再展开章节，再展开具体步骤。每一步都足够清楚时才停止。</div><div class="warning"><strong>课件勘误：</strong>“wait until kettle if full”应理解为“wait until kettle is full”。</div>`,questions:[['逐步求精的核心是什么？',['合并成模糊描述','逐层拆成简单步骤','删除顺序','改变量名'],1,'它就是逐层分解和细化。'],['何时停止细化？',['达到100步','每步已能被执行者理解执行','仍完全看不懂','随时'],1,'步骤足够具体时完成。']]},
      {title:'模块调用与咖啡算法',summary:'理解展开全部细节与调用子算法的两种组织方法。',body:`<h2>Variation 1 展开，Variation 2 封装后调用</h2><p>第一种写法把烧水、取咖啡和倒水全部展开，细节完整但主流程很长。第二种写法把细节放到独立子算法：</p><div class="formula">Call Making_boil_water() · Call Put_Coffee_in_cup()</div><p>主算法只保留整体顺序，子算法在其他位置定义。这接近函数、过程和模块的思想。</p><div class="plain"><strong>大白话</strong>菜谱主页面只写“制作酱汁”，详细做法放独立小节。主流程更清楚，子步骤也能重复使用。</div>`,questions:[['Call Put_Coffee_in_cup() 表示什么？',['删除算法','执行已定义子算法','终止程序','创建硬件'],1,'Call 调用封装好的子过程。'],['封装子算法的好处是什么？',['主流程清楚且可复用','保证零错误','取消顺序','增加歧义'],0,'封装降低复杂度并支持复用。']]},
      {title:'伪代码',summary:'用接近日常语言的结构化文字，在写真实代码前想清楚程序。',body:`<h2>Pseudocode 介于自然语言和编程语言之间</h2><p>伪代码是算法的非正式文本表示，强调执行逻辑，不要求完全符合某种语言语法，也不能直接由计算机执行。</p><div class="formula">get glass → get juice → open → pour → return container → drink</div><p>它帮助我们先把程序想清楚，再转换成 Python。一个问题可能有多个有效算法，它们的效率可能不同。</p><div class="warning"><strong>准确理解：</strong>“由 executable statements 组成”表示步骤描述可执行动作，不表示伪代码本身能直接运行。</div>`,questions:[['关于伪代码哪项正确？',['必须符合Python','CPU可直接执行','用接近日常语言描述算法','只能画图'],2,'伪代码是非正式文本表达。'],['伪代码主要价值是什么？',['写代码前梳理逻辑','替代测试','控制电源','保存文件'],0,'它帮助先思考再实现。']]},
      {title:'买车问题：输入与公式',summary:'从业务问题抽取输入、输出，并推导总拥有成本。',body:`<h2>更便宜的购买价不一定代表十年总成本更低</h2><p>输入包括两车购买价、燃油效率、油价、年里程和持有年数，输出是总成本较低的车。</p><div class="formula">年耗油 = 年里程 ÷ MPG<br>年油费 = 每加仑价格 × 年耗油<br>运营成本 = 年数 × 年油费<br>总成本 = 购买价 + 运营成本</div><p>分别计算两车总成本，再用 if/else 选择较低者。</p><div class="warning"><strong>模型限制：</strong>真实决策还可能考虑维修、保险和折旧；本算法只使用题目明确因素。</div>`,questions:[['年耗油量怎么算？',['年里程×MPG','年里程÷MPG','油价÷年数','购买价+MPG'],1,'里程除以每加仑里程得到加仑数。'],['算法最终怎样选车？',['最高购买价','最低MPG','最低总成本','随机'],2,'比较持有期总成本。']]},
      {title:'银行复利与循环',summary:'用 while 重复更新年份和余额，直到余额翻倍。',body:`<h2>重复计算最适合用循环</h2><div class="formula">year = 0；balance = 10000<br>while balance &lt; 20000:<br>&nbsp;&nbsp;year = year + 1<br>&nbsp;&nbsp;balance = balance × 1.05<br>report year</div><p>初始化设置起点；while 条件决定是否继续；循环体每轮代表一年；余额达到目标后输出年份。</p><div class="plain"><strong>大白话</strong>每过一年，年份加 1、余额增加 5%，再问达到两万元没有。</div><div class="warning"><strong>陷阱：</strong>忘记更新余额会让条件一直为真，可能形成无限循环。</div>`,questions:[['while 条件作用是什么？',['初始化','决定是否继续循环','清零','输出'],1,'条件控制重复。'],['乘以1.05表示什么？',['减少5%','增加5%','年份翻倍','变1.05元'],1,'保留原额并增加5%。']]},
      {title:'流程图与符号',summary:'用图形和箭头表示算法，掌握椭圆、矩形与菱形。',body:`<h2>Flowchart 是算法的图形表示</h2><ul><li><strong>椭圆：</strong>开始或结束。</li><li><strong>矩形：</strong>处理或动作。</li><li><strong>菱形：</strong>条件判断，产生 true/false 分支。</li><li><strong>箭头：</strong>控制流程方向。</li></ul><div class="formula">Start → Get scores → Average → ◇ Average ≥ 60? → true: Print Passed → End</div><p>课件中 false 路径直接到 End，因此不足 60 时不会打印 Passed。</p><div class="plain"><strong>大白话</strong>矩形是“做事”，菱形是“问问题并分叉”，椭圆是“开始/结束”。</div>`,questions:[['菱形表示什么？',['开始结束','一般动作','条件判断','数据库'],2,'菱形是 decision symbol。'],['计算平均分用什么图形？',['矩形','菱形','椭圆','箭头'],0,'处理动作用矩形。']]},
      {title:'自顶向下与模块化',summary:'用 divide-and-conquer 拆分大问题，并实现单一职责模块。',body:`<h2>Top-down 是思考方式，Modularization 是程序结构</h2><p>自顶向下设计从整体目标开始，逐层拆出子问题。模块化把子问题实现为 classes、functions 或 procedures，最后组合为完整系统。</p><p>每个模块通常完成一个明确任务，使程序更易读、易管理、健壮、灵活和可复用。</p><div class="plain"><strong>大白话</strong>把读取数据、计算成本、比较结果和输出报告分别交给清楚的小模块，不要写一个包办一切的超长程序。</div><div class="warning"><strong>易错：</strong>模块化不是随意切代码；好的模块应有集中明确的职责。</div>`,questions:[['Top-down 指什么？',['随机拼细节','从大问题逐层拆分','一个巨大函数','忽略整体'],1,'从整体向下分解。'],['模块应怎样设计？',['一个明确任务','所有任务','无接口','单字母名'],0,'单一职责利于测试复用。']]},
      {title:'文档与测试层次',summary:'掌握需求、设计、程序文档，以及单元、集成和系统测试。',body:`<h2>项目除了代码，还要记录为什么、怎样设计、怎样验证</h2><ol><li>Requirements specification</li><li>Design specification</li><li>Detailed design specification</li><li>Program documentation</li><li>Unit test specification</li><li>Integration test</li><li>System test specification</li></ol><p><strong>Unit test</strong> 检查独立模块；<strong>Integration test</strong> 检查模块接口与协作；<strong>System test</strong> 检查完整系统是否满足要求。</p><div class="warning"><strong>易错：</strong>代码注释只是程序文档的一部分，不等于整个项目文档。</div>`,questions:[['哪种测试检查模块组合？',['Unit','Integration','Naming','Storage'],1,'集成测试检查模块协作。'],['需求规格记录什么？',['系统要实现什么','CPU电路','密码','变量颜色'],0,'需求描述目标和功能。']]},
      {title:'防御性编程',summary:'预防坏输入、边界问题和难以理解的失败。',body:`<h2>好程序不应只在完美输入下工作</h2><ul><li>验证输入，避免坏数据导致崩溃。</li><li>输出应容易理解，失败时给有意义的信息。</li><li>正常、优雅地终止程序。</li><li>用最低、最高、刚好达到和刚好未达到等边界值测试。</li><li>不要直接比较浮点数完全相等，应使用容差。</li><li>使用有意义的名称、注释和缩进。</li></ul><div class="plain"><strong>大白话</strong>假设用户会输错、数据会到边界、环境会出问题，并提前处理。</div><div class="warning"><strong>课件勘误：</strong>“appropriate maker”应理解为 appropriate marker，即合适的结束标记。</div>`,questions:[['哪项属于防御性编程？',['只测正常值','验证输入并给有意义错误','忽略警告','无意义变量名'],1,'主动处理异常输入。'],['浮点数不宜直接判完全相等，为什么？',['可能有舍入误差','不能计算','CPU不认数字','一定崩溃'],0,'二进制浮点常有微小误差。']]},
      {title:'语法错误与警告',summary:'分清阻止程序构建的 syntax error 与提示潜在问题的 warning。',body:`<h2>Syntax error 是违反编程语言规则</h2><p>关键字大小写错误、缺少或不匹配的引号、括号、冒号和标点，都会在编译或解析阶段被发现，并通常阻止程序运行。</p><div class="formula">Print("Hello") · print(Hello World!) · print("Hello World!')</div><p>先修错误列表中的第一个错误，再重新运行，因为后续报错可能是连锁反应。</p><p><strong>Warning</strong> 通常不阻止构建，但可能提示未使用变量、变量未初始化等潜在错误。</p><div class="warning"><strong>不要忽略 warning：</strong>它不一定都是 bug，却经常指出危险代码。</div>`,questions:[['引号不匹配通常是什么？',['Syntax error','Logic only','硬件错','数据库错'],0,'它违反语法。'],['Warning 特点是什么？',['一定阻止构建','不一定阻止但提示风险','保证正确','只来自输入'],1,'警告需要检查。']]},
      {title:'逻辑错误与运行时错误',summary:'程序能运行不等于正确；还要分清错误结果与执行时崩溃。',body:`<h2>三类错误要按“何时发现、怎样表现”区分</h2><table><tr><th>类型</th><th>表现</th><th>例子</th></tr><tr><td>Syntax</td><td>语法不合法，通常不能运行</td><td>缺引号</td></tr><tr><td>Logic/Semantic</td><td>能运行但结果错误</td><td>score ≥ 50 打印 fail</td></tr><tr><td>Runtime</td><td>执行到某操作时出错</td><td>1 / 0</td></tr></table><div class="plain"><strong>大白话</strong>语法错是“句子写不通”；逻辑错是“句子通顺但意思反了”；运行时错是“做到某一步出现非法操作”。</div><div class="warning"><strong>语言差异：</strong>用 = 代替 == 在 Python 的 if 条件通常是语法错误；在某些语言中可能成为逻辑错误。分类要结合语言。</div>`,questions:[['及格却打印fail是什么？',['Logic error','Syntax','硬件','存储'],0,'逻辑与意图相反。'],['1/0通常何时出错？',['写文档','运行到该语句','关屏幕','设计前'],1,'除零是运行时错误。']]},
      {title:'避免 Bug、风格与缩进',summary:'通过小步测试、清晰命名、注释、空白和缩进降低调试成本。',body:`<h2>不要一次写完整个程序</h2><ul><li>每写少量代码就编译、运行和测试。</li><li>不忽略警告，保持代码组织清楚。</li><li>注释说明代码的目的和假设。</li><li>使用 <code>annual_fuel_cost</code> 这类有意义的名称。</li><li>用空行分隔不同目的的代码。</li><li>用缩进表现控制结构。</li></ul><p>在 Python 中，缩进还直接定义代码块。判断 else 属于哪个 if，要看它与哪个 if 同级对齐。</p><div class="formula">if exam:<br>&nbsp;&nbsp;if score ≥ 50: Passed<br>&nbsp;&nbsp;else: Failed</div><p>这里 else 属于内层分数判断；如果 else 与外层 <code>if exam</code> 对齐，它就表示未参加考试。</p><div class="plain"><strong>大白话</strong>频繁测试能缩小排查范围；清晰缩进让人和 Python 都知道每条语句属于哪个分支。</div>`,questions:[['为什么写几行就测试？',['缩小bug范围','让程序更慢','替代算法','取消错误'],0,'问题多半在最近改动。'],['Python 中 else 配对主要看什么？',['变量名','缩进层级','屏幕大小','注释数'],1,'同级缩进定义结构。']]}
    ];

    const STORAGE_KEY = 'isom2007-intro-programming-v1';
    const totalQuestions = lessons.length * 2;
    let state = loadState();
    let current = Math.min(state.current || 0, lessons.length - 1);

    function freshState() {
      return { current: 0, completed: {}, answers: {}, scores: {} };
    }
    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return saved && saved.completed ? saved : freshState();
      } catch (_) { return freshState(); }
    }
    function saveState() {
      state.current = current;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
    function totalScore() { return Object.values(state.scores).reduce((sum, n) => sum + n, 0); }
    function answeredCount() { return Object.keys(state.completed).length * 2; }

    function render() {
      renderNav();
      const content = document.getElementById('content');
      content.innerHTML = lessons.map((lesson, index) => lessonTemplate(lesson, index)).join('') + resultTemplate();
      bindLessonControls();
      showPage(current, false);
      refreshHeader();
    }

    function lessonTemplate(lesson, index) {
      const completed = !!state.completed[index];
      return `<section class="lesson" id="lesson-${index}" aria-labelledby="title-${index}">
        <div class="eyebrow">知识点 ${String(index + 1).padStart(2, '0')} / ${lessons.length}</div>
        <h1 id="title-${index}">${lesson.title}</h1>
        <p class="lead">${lesson.summary}</p>
        <article class="learning-card">${lesson.body}</article>
        <section class="quiz-block" aria-labelledby="quiz-title-${index}">
          <div class="quiz-head"><h2 id="quiz-title-${index}">掌握检测</h2><p>两题都作答后提交。提交后会立即解释答案。</p></div>
          ${lesson.questions.map((q, qi) => questionTemplate(index, qi, q, completed)).join('')}
          <div class="quiz-actions">
            <span class="quiz-status" id="status-${index}">${completed ? `已完成 · ${state.scores[index]} / 2` : '尚未提交'}</span>
            <button class="btn btn-primary submit-quiz" data-index="${index}" ${completed ? 'disabled' : ''}>${completed ? '已提交' : '提交答案'}</button>
          </div>
        </section>
        <div class="page-actions">
          <button class="btn btn-secondary prev-page" data-index="${index}" ${index === 0 ? 'disabled' : ''}>← 上一个知识点</button>
          <button class="btn btn-primary next-page" data-index="${index}" ${!completed ? 'disabled' : ''}>${index === lessons.length - 1 ? '查看本章成绩 →' : '下一个知识点 →'}</button>
        </div>
      </section>`;
    }

    function questionTemplate(li, qi, q, completed) {
      const saved = state.answers[li]?.[qi];
      const correct = q[2];
      return `<div class="question" data-question="${li}-${qi}">
        <p class="question-title">${qi + 1}. ${q[0]}</p>
        <div class="options">${q[1].map((opt, oi) => {
          let cls = 'option';
          if (completed && oi === correct) cls += ' correct';
          if (completed && oi === saved && saved !== correct) cls += ' wrong';
          return `<label class="${cls}"><input type="radio" name="q-${li}-${qi}" value="${oi}" ${saved === oi ? 'checked' : ''} ${completed ? 'disabled' : ''}><span>${String.fromCharCode(65 + oi)}. ${opt}</span></label>`;
        }).join('')}</div>
        <div class="feedback ${completed ? 'show ' + (saved === correct ? 'good' : 'bad') : ''}" id="feedback-${li}-${qi}">${completed ? (saved === correct ? '回答正确。' : `正确答案是 ${String.fromCharCode(65 + correct)}。`) + ' ' + q[3] : ''}</div>
      </div>`;
    }

    function resultTemplate() {
      const complete = Object.keys(state.completed).length === lessons.length;
      const score = totalScore();
      const pct = Math.round(score / totalQuestions * 100);
      const weak = lessons.map((l, i) => ({ title: l.title, score: state.scores[i] ?? 0, i })).filter(x => x.score < 2);
      let label = pct >= 90 ? 'A 级掌握' : pct >= 80 ? '基础扎实' : pct >= 70 ? '基本掌握' : pct >= 60 ? '需要复习' : '建议重新学习';
      return `<section class="lesson" id="result-page">
        <div class="eyebrow">Lecture 1 完成报告</div><h1>本章成绩</h1>
        <p class="lead">${complete ? `你已完成全部 ${lessons.length} 个知识点和 ${totalQuestions} 道题。` : '完成所有知识点后才会生成最终成绩。'}</p>
        <div class="result-card">
          <h2>${complete ? label : '课程尚未完成'}</h2>
          <div class="result-score"><strong>${score}</strong><span>/ ${totalQuestions} 分 · ${pct}%</span></div>
          <div class="result-band" aria-label="得分百分比"><div style="width:${pct}%"></div></div>
          <h3>需要重点复习</h3>
          <ul class="weak-list">${weak.length ? weak.map(x => `<li><strong>${x.title}</strong>：${x.score} / 2 <button class="btn btn-secondary review-page" data-index="${x.i}">回看</button></li>`).join('') : '<li>全部知识点均为满分。可以开始做综合应用题。</li>'}</ul>
          <div class="page-actions"><button class="btn btn-secondary" id="backToLast">← 返回最后一课</button><button class="btn btn-primary" id="resetCourse">重新学习本章</button></div>
        </div>
      </section>`;
    }

    function renderNav() {
      const list = document.getElementById('lessonList');
      list.innerHTML = lessons.map((l, i) => {
        const unlocked = i === 0 || !!state.completed[i - 1];
        const done = !!state.completed[i];
        return `<button class="lesson-link" data-index="${i}" ${unlocked ? '' : 'disabled'}><span class="num">${String(i + 1).padStart(2, '0')}</span><span class="name">${l.title}</span><span class="state">${done ? '✓' : unlocked ? '•' : '×'}</span></button>`;
      }).join('');
      list.querySelectorAll('.lesson-link:not(:disabled)').forEach(btn => btn.addEventListener('click', () => showPage(+btn.dataset.index)));
    }

    function bindLessonControls() {
      document.querySelectorAll('.submit-quiz').forEach(btn => btn.addEventListener('click', () => submitQuiz(+btn.dataset.index)));
      document.querySelectorAll('.prev-page').forEach(btn => btn.addEventListener('click', () => showPage(Math.max(0, +btn.dataset.index - 1))));
      document.querySelectorAll('.next-page').forEach(btn => btn.addEventListener('click', () => {
        const i = +btn.dataset.index;
        if (i === lessons.length - 1) showResult(); else showPage(i + 1);
      }));
      document.querySelectorAll('.review-page').forEach(btn => btn.addEventListener('click', () => showPage(+btn.dataset.index)));
      document.getElementById('backToLast')?.addEventListener('click', () => showPage(lessons.length - 1));
      document.getElementById('resetCourse')?.addEventListener('click', resetCourse);
    }

    function submitQuiz(index) {
      const selections = [];
      for (let qi = 0; qi < 2; qi++) {
        const checked = document.querySelector(`input[name="q-${index}-${qi}"]:checked`);
        if (!checked) {
          document.getElementById(`feedback-${index}-${qi}`).className = 'feedback show bad';
          document.getElementById(`feedback-${index}-${qi}`).textContent = '请先选择一个答案。';
          return;
        }
        selections.push(+checked.value);
      }
      state.answers[index] = selections;
      state.completed[index] = true;
      state.scores[index] = selections.reduce((sum, answer, qi) => sum + (answer === lessons[index].questions[qi][2] ? 1 : 0), 0);
      saveState();
      render();
      showPage(index, false);
      document.getElementById(`status-${index}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function showPage(index, scroll = true) {
      current = index;
      document.querySelectorAll('.lesson').forEach(x => x.classList.remove('active'));
      document.getElementById(`lesson-${index}`).classList.add('active');
      document.querySelectorAll('.lesson-link').forEach(x => x.classList.toggle('active', +x.dataset.index === index));
      document.getElementById('crumb').textContent = `Lecture 1 · ${index + 1}. ${lessons[index].title}`;
      closeMenu();
      saveState();
      refreshHeader();
      if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showResult() {
      document.querySelectorAll('.lesson').forEach(x => x.classList.remove('active'));
      document.getElementById('result-page').classList.add('active');
      document.querySelectorAll('.lesson-link').forEach(x => x.classList.remove('active'));
      document.getElementById('crumb').textContent = 'Lecture 1 · 本章成绩';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      closeMenu();
    }

    function refreshHeader() {
      const completed = Object.keys(state.completed).length;
      document.getElementById('progressText').textContent = `${completed} / ${lessons.length}`;
      document.getElementById('progressFill').style.width = `${completed / lessons.length * 100}%`;
      document.getElementById('scoreLive').textContent = `得分 ${totalScore()} / ${answeredCount()}`;
    }

    function resetCourse() {
      if (!confirm('确定清除全部学习进度和成绩吗？')) return;
      localStorage.removeItem(STORAGE_KEY);
      state = freshState(); current = 0; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    const sidebar = document.getElementById('sidebar');
    const menuButton = document.getElementById('menuButton');
    menuButton.addEventListener('click', () => {
      const open = sidebar.classList.toggle('open');
      menuButton.setAttribute('aria-expanded', String(open));
    });
    function closeMenu() { sidebar.classList.remove('open'); menuButton.setAttribute('aria-expanded', 'false'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
    render();
  </script>
</body>
</html>
